<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>图4：擦边题材分布</title>
<style>

<h2>图4：擦边题材分布</h2>
<div class="content"><div style="display:flex;justify-content:center;align-items:center;gap:40px;height:100%;">
<div style="width:240px;height:240px;border-radius:50%;background:conic-gradient(#fc8166 0% 55.7%,#fac063 55.7% 78.30000000000001%,#e55b46 78.30000000000001% 86.10000000000001%,#50c885 86.10000000000001% 97.4%,#6cb0f9 97.4% 100.0%);"></div>

</div>

</style></div>
