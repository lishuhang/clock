name: patent-download

on:
  workflow_dispatch:
  push:
    paths:
      - '1102-patent/resolved.json'

concurrency:
  group: patent-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download real patent PDFs
        working-directory: 1102-patent
        run: python3 pipeline.py download
      - name: Commit PDFs
        working-directory: 1102-patent
        run: |
          git config user.email "bot@workbuddy.local"
          git config user.name "patent-bot"
          git remote set-url origin https://x-access-token:${{secrets.GITHUB_TOKEN}}@github.com/${{github.repository}}.git
          git add -A
          git commit -m "data(1102-patent): download real patent PDFs" || echo "nothing"
          git pull --rebase origin ${{github.ref_name}} || true
          git push origin HEAD:${{github.ref_name}}
