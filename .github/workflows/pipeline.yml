name: patent-pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - '1102-patent/patents.json'
      - '1102-patent/pipeline.py'
      - '1102-patent/pipeline.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run pipeline (resolve real pub numbers + download PDFs)
        working-directory: 1102-patent
        run: python3 pipeline.py
      - name: Commit results
        working-directory: 1102-patent
        run: |
          git config user.email "bot@workbuddy.local"
          git config user.name "patent-bot"
          git add resolved.json pdf/
          git commit -m "auto: resolve real pub numbers + download patent PDFs" || echo "nothing to commit"
          git push https://x-access-token:${{secrets.GITHUB_TOKEN}}@github.com/${{github.repository}}.git HEAD:${{github.ref_name}}
