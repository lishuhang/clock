[project]
name = "vidsync"
version = "0.1.0"
description = "Video multi-platform draft publisher for Chinese self-media (12 platforms)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "vidsync-agent"}]

dependencies = [
    "playwright>=1.40.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.5",
    "py7zr>=0.20.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
vidsync = "vidsync.web.main:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["vidsync*"]
