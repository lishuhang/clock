<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>vidsync - 视频多平台草稿发布</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>vidsync <span class="ver">v0.1</span></h1>
  <p class="tagline">视频多平台草稿一键发布系统</p>
</header>

<main>
  <section id="platforms-section">
    <h2>📋 平台状态</h2>
    <div id="platforms-grid"></div>
    <button id="rescan-btn">🔄 重新扫描 cookies</button>
    <p class="hint" id="cookies-hint"></p>
  </section>

  <section id="form-section">
    <h2>📝 填写物料</h2>
    <form id="publish-form">
      <div class="form-row">
        <label>视频文件（竖屏 9:16）<span class="required">*</span></label>
        <input type="file" id="video" accept="video/*" required>
        <small class="small">MP4/MOV，建议 ≤500MB</small>
      </div>

      <div class="form-row">
        <label>竖屏封面（视频号 1080×1260）<span class="required">*</span></label>
        <input type="file" id="vertical_cover" accept="image/*" required>
      </div>

      <div class="form-row">
        <label>横屏封面（16:9）<span class="required">*</span></label>
        <input type="file" id="horizontal_cover" accept="image/*" required>
      </div>

      <div class="form-row">
        <label>短标题（≤12字）<span class="required">*</span></label>
        <input type="text" id="short_title" maxlength="20" required placeholder="例：午夜的钟声">
      </div>

      <div class="form-row">
        <label>长标题（≤22字）<span class="required">*</span></label>
        <input type="text" id="long_title" maxlength="50" required placeholder="例：午夜的钟声响起，城市在沉睡中醒来">
      </div>

      <div class="form-row">
        <label>关键字（5-10个，逗号分隔）<span class="required">*</span></label>
        <input type="text" id="keywords" required placeholder="例：城市,午夜,钟声,沉睡,醒来">
      </div>

      <div class="form-row">
        <label>视频简介（可选，留空时用长标题）</label>
        <textarea id="description" rows="3" placeholder="留空则自动使用长标题"></textarea>
      </div>

      <div class="form-row">
        <label>选择平台</label>
        <div id="platform-checkboxes"></div>
      </div>

      <button type="submit" id="submit-btn">🚀 开始保存草稿</button>
    </form>
  </section>

  <section id="progress-section" style="display:none;">
    <h2>📊 进度</h2>
    <div id="progress-log"></div>
    <div id="progress-summary"></div>
  </section>

  <section id="result-section" style="display:none;">
    <h2>✅ 结果</h2>
    <div id="result-table"></div>
    <p class="hint">如出问题，请把日志文件夹打包发给开发：
      <code id="log-dir"></code>
    </p>
  </section>
</main>

<footer>
  <p>vidsync v0.1.0 · <a href="https://github.com/lishuhang/clock/tree/main/0803-vidsync" target="_blank">GitHub</a></p>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
