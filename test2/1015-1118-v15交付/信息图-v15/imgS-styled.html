<!doctype html>
<!-- 娱乐资本论信息图 v3.1 / A。先读 SKILL.md；只改 YZ_EDIT 区。 -->
<html lang="zh-CN" data-yz-contract="3.1.0" data-yz-mode="a">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Style A</title>
<style>
@font-face{font-family:AliPuHui;src:url('assets/alipuhui-regular.ttf') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:AliPuHui;src:url('assets/alipuhui-bold.ttf') format('truetype');font-weight:700;font-display:block}
@font-face{font-family:AliPuHui;src:url('assets/alipuhui-black.ttf') format('truetype');font-weight:900;font-display:block}
:root{--a:#fc8166;--ad:#e55b46;--t:#312e2e;--s:#6b6666;--m:#9a9595;--l:#e7e3e1}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--t);font-family:AliPuHui,sans-serif}body{width:max-content}
.chart-container{position:relative;isolation:isolate;width:900px;min-height:900px;display:flex;flex-direction:column;overflow:hidden;padding:68px 72px 38px;background:#fff}
.brand{display:flex;align-items:center}.brand img{display:block;object-fit:contain}.brand--horizontal{gap:12px;height:62px}.brand--horizontal .logo-icon{width:53px;height:62px}.brand--horizontal .logo-text{width:156px;height:auto}
.yz-watermark{position:absolute;z-index:10;left:50%;top:50%;width:420px;transform:translate(-50%,-48%);opacity:.1;pointer-events:none}.brand--vertical{flex-direction:column;justify-content:center;gap:20px}.brand--vertical .logo-icon{width:220px;height:auto}.brand--vertical .logo-text{width:360px;height:auto}
.chart-title,.chart-body,.chart-footer{position:relative;z-index:20}.chart-title{margin:0 0 38px;font-size:68px;line-height:1.12;font-weight:900;letter-spacing:-1.5px}.chart-body{flex:1;min-height:560px;font-size:28px;line-height:1.45}.chart-body strong,.yz-emphasis{font-weight:700;color:var(--ad)}
.chart-footer{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-top:34px;padding-top:20px;border-top:1px solid var(--l)}.chart-source{font-size:26px;line-height:1.35;color:var(--m)}
.yz-placeholder{display:grid;place-items:center;min-height:560px;border:2px dashed var(--l);color:var(--m)}table{width:100%;border-collapse:collapse;font-size:28px}th,td{padding:16px 12px;border-bottom:1px solid var(--l);text-align:left}th{font-weight:700;color:var(--s)}
</style></head>
<body><main class="chart-container">
<div class="yz-watermark brand brand--vertical" aria-hidden="true"><img class="logo-icon" src="assets/logo-icon.svg" alt=""><img class="logo-text" src="assets/logo-text.svg" alt=""></div>
<!-- YZ_EDIT_1_BEGIN：只替换标题文字，不加“图N：” --><h1 class="chart-title">按用户画像分的各平台功能适配情况</h1><!-- YZ_EDIT_1_END -->
<!-- YZ_EDIT_2_BEGIN：用已核验图表替换占位节点 --><section class="chart-body"><style>
.bz-sub{font-size:24px;color:var(--s);margin:-24px 0 18px;line-height:1.35}
.bz-table{table-layout:fixed}
.bz-table th{font-size:26px;padding:10px 8px;color:var(--s);border-bottom:3px solid var(--l);line-height:1.25;white-space:normal;vertical-align:bottom}
.bz-table td{padding:10px 8px;line-height:1.3;word-break:break-word;vertical-align:top;font-size:28px}
.bz-p{font-weight:700}
.bz-yes{color:var(--ad);font-weight:700}
.bz-part{color:var(--t);font-weight:700}
.bz-no{color:#c9c4c2;font-weight:400}
.bz-dash{color:#c9c4c2}
</style><table class="bz-table"><colgroup><col style="width:10%"><col style="width:30%"><col style="width:30%"><col style="width:30%"></colgroup><thead><tr><th>排名</th><th>漫剧连载类</th><th>专业影视类</th><th>电商出海类</th></tr></thead><tbody><tr><td class="bz-p">1</td><td>小云雀</td><td>纳逗Pro</td><td>OiiOii</td></tr><tr><td class="bz-p">2</td><td>巨日禄</td><td>OiiOii</td><td>小云雀</td></tr><tr><td class="bz-p">3</td><td>纳逗Pro</td><td>ShotLab</td><td>LibTV</td></tr><tr><td class="bz-p">4</td><td>Seko</td><td>LibTV</td><td>万兴剧厂</td></tr><tr><td class="bz-p">5</td><td>OiiOii</td><td>小云雀</td><td>Seko</td></tr><tr><td class="bz-p">6</td><td>ShotLab</td><td>AniShort</td><td>AniShort</td></tr><tr><td class="bz-p">7</td><td>LibTV</td><td>Seko</td><td>纳逗Pro</td></tr><tr><td class="bz-p">8</td><td>AniShort</td><td>万兴剧厂</td><td>TapNow</td></tr><tr><td class="bz-p">9</td><td>万兴剧厂</td><td>TapNow</td><td>巨日禄</td></tr><tr><td class="bz-p">10</td><td>TapNow</td><td>巨日禄</td><td>ShotLab</td></tr></tbody></table></section><!-- YZ_EDIT_2_END -->
<footer class="chart-footer"><!-- YZ_EDIT_3_BEGIN：只替换来源 --><div class="chart-source">数据来源：娱乐资本论根据官方手册和实测整理，信息截至2026年10月5日，如与实际有差异，以实际呈现为准。</div><!-- YZ_EDIT_3_END --><div class="brand brand--horizontal" aria-label="娱乐资本论 Entertainment Capital"><img class="logo-icon" src="assets/logo-icon.svg" alt=""><img class="logo-text" src="assets/logo-text.svg" alt=""></div></footer>
</main>
<script>
async function yzCheck(){await document.fonts.ready;await Promise.all([...document.images].map(i=>i.complete?Promise.resolve():i.decode()));const c=document.querySelector('.chart-container'),t=document.querySelector('.chart-title'),b=document.querySelector('.chart-body'),e=[];if(document.documentElement.dataset.yzContract!=='3.1.0'||document.documentElement.dataset.yzMode!=='a')e.push('contract');if(Math.round(c.getBoundingClientRect().width)!==900)e.push('canvas');if(parseFloat(getComputedStyle(t).fontSize)!==68)e.push('title');if(parseFloat(getComputedStyle(b).fontSize)!==28)e.push('body');if(!document.fonts.check('900 68px AliPuHui')||!document.fonts.check('400 28px AliPuHui'))e.push('font');if(document.images.length!==4||[...document.images].some(i=>!i.naturalWidth))e.push('logo');if(Math.abs(parseFloat(getComputedStyle(document.querySelector('.yz-watermark')).opacity)-.1)>.001)e.push('watermark');if(/【(?:TITLE|CHART_BODY|SOURCE)_HERE】/.test(document.body.textContent))e.push('placeholder');if(/^\s*图\s*\d+\s*[：:]/.test(t.textContent))e.push('title-prefix');if([...document.querySelectorAll('[src],[href]')].some(n=>/^https?:/i.test(n.getAttribute('src')||n.getAttribute('href')||'')))e.push('external');if([...document.querySelectorAll('*')].some(n=>getComputedStyle(n).boxShadow!=='none'))e.push('shadow');const r={contract:'YZ-INFOGRAPHIC-V3.1',mode:'a',state:e.length?'noncompliant_fallback':'compliant',errors:e};console[e.length?'error':'log'](r);return r}window.yzCheck=yzCheck;
</script></body></html>
