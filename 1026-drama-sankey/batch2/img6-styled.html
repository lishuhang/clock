<script>
/* ===== batch2 img6 桑基布局构建（数据 → DOM → 量测 → SVG 连线；算法与 v1.0 img1 一致，强调线改深灰） ===== */
(function(){
'use strict';
var FLOW_W=150, TF=8, TP=11, GAP=1;
var COLF='rgba(154,149,149,.34)', COLP='rgba(49,46,46,.9)';
var PROMPTS=[
 {id:'T1',title:'守时斋的判定',tags:['文戏','少参'],points:'原生中文渲染、5节拍自主切镜、师徒身高差、精准微动作、对白口型同步、定格动画质感'},
 {id:'T2',title:'发条暴走',tags:['武戏','少参'],points:'纯提示词音画分离、高动态武戏、自主切镜、元素比例、准确理解提示词'},
 {id:'T3',title:'深夜取钟人',tags:['文戏','多参'],points:'提示词时间戳控制、光线控制、师徒与顾客隔柜台内外面对面站位与180°正反打对视、前景玻璃钟罩遮挡'},
 {id:'T4',title:'齿轮惊魂：极限交锋',tags:['武戏','多参'],points:'超多参考图、7人群像、3D白模、防跑脸、跨镜连续轨迹、15秒8镜快切、中文渲染'}
];
var ITEMS=[
 {id:'A1',name:'时长截断或注水',layer:'f',p:['T1','T2','T3','T4']},
 {id:'A2',name:'音轨缺失',layer:'f',p:['T1','T2','T3','T4']},
 {id:'A3',name:'分辨率虚标',layer:'f',p:['T1','T2','T3','T4']},
 {id:'A4',name:'文字乱码',layer:'p',p:['T1','T4']},
 {id:'A5',name:'积分不退',layer:'f',p:['T1','T2','T3','T4']},
 {id:'B1',name:'审核违规不出片',layer:'f',p:['T1','T2','T3','T4'],plat:['jurilu.jpg','nadou.png','wanxing.png','libtv.jpg','oiioii.png','seko.png','shotlab.png','tapnow.png']},
 {id:'B2',name:'参考图不能一次全传',layer:'p',p:['T2','T3','T4'],plat:['jurilu.jpg','wanxing.png']},
 {id:'B3',name:'不能传参考音频',layer:'f',p:['T1','T2','T3','T4']},
 {id:'B4',name:'生成速度太慢',layer:'f',p:['T1','T2','T3','T4']},
 {id:'B0',name:'主体库 @引用 智能补全与自动连线',layer:'f',bonus:true,p:['T1','T2','T3','T4'],plat:['anishort.png','oiioii.png','wanxing.png','xiaoyunque.png','shotlab.png']},
 {id:'C1',name:'人物渲染异常',layer:'p',p:['T3','T4'],plat:['oiioii.png','shotlab.png','tapnow.png','anishort.png']},
 {id:'C2',name:'画面出现箭头、线或框',layer:'f',p:['T1','T2','T3','T4'],plat:['oiioii.png','shotlab.png','tapnow.png','libtv.jpg','seko.png','xiaoyunque.png','nadou.png']},
 {id:'C3',name:'木偶跑脸变真人',layer:'f',p:['T1','T2','T3','T4'],plat:['jurilu.jpg','seko.png']},
 {id:'C4',name:'暗室被照得像白天',layer:'p',p:['T3']},
 {id:'D1',name:'不切或漏镜头，时间轴定位不准',layer:'f',p:['T1','T2','T3','T4']},
 {id:'D2',name:'群演消失，衣服出错等',layer:'p',p:['T2','T4'],plat:['shotlab.png','seko.png']},
 {id:'D3',name:'人物站位出错',layer:'p',p:['T3'],plat:['nadou.png','oiioii.png']},
 {id:'D4',name:'老匠忽略“轻微”二字乱摇头',layer:'p',p:['T1']},
 {id:'E1',name:'纯音效段冒出人声',layer:'p',p:['T2']},
 {id:'E2',name:'偷加BGM',layer:'f',p:['T1','T2','T3','T4'],plat:['wanxing.png','oiioii.png','jurilu.jpg','tapnow.png','anishort.png','shotlab.png','xiaoyunque.png']},
 {id:'E3',name:'冒出台词字幕',layer:'p',p:['T1','T3','T4'],plat:['wanxing.png','oiioii.png','nadou.png','tapnow.png','anishort.png','libtv.jpg','shotlab.png','xiaoyunque.png','seko.png']},
 {id:'E4',name:'导出带强制水印、角标',layer:'f',p:['T1','T2','T3','T4']},
 {id:'E5',name:'定格木偶没还原“抽帧感”',layer:'p',p:['T1','T2','T3']}
];
var PLATN={'anishort.png':'AniShort','nadou.png':'纳逗Pro','oiioii.png':'OiiOii','seko.png':'Seko','shotlab.png':'ShotLab','tapnow.png':'TapNow','wanxing.png':'万兴剧厂','jurilu.jpg':'巨日禄','libtv.jpg':'LibTV','xiaoyunque.png':'小云雀'};
var GROUPFIRST={'B1':1,'C1':1,'D1':1,'E1':1};
function el(tag,cls,parent){var e=document.createElement(tag);if(cls)e.className=cls;if(parent)parent.appendChild(e);return e}
function txt(node,s){node.appendChild(document.createTextNode(s))}
function thick(it){return it.layer==='p'?TP:TF}

function build(){
  var colL=document.querySelector('.col-left'),colR=document.querySelector('.col-right');
  /* 左：提示词卡片 */
  PROMPTS.forEach(function(p){
    var card=el('div','prompt-card',colL);
    var head=el('div','p-head',card);
    var code=el('span','p-code',head);txt(code,p.id);
    p.tags.forEach(function(t){var tag=el('span','p-tag',head);txt(tag,t)});
    var title=el('div','p-title',card);txt(title,p.title);
    el('div','p-div',card);
    var lab=el('div','p-label',card);txt(lab,'测试要点');
    var pts=el('div','p-points',card);txt(pts,p.points);
  });
  /* 右：加/扣分项行（无平台命中项不显示 favicon） */
  ITEMS.forEach(function(it){
    var row=el('div','item-row'+(GROUPFIRST[it.id]?' group-start':''),colR);
    var main=el('div','row-main',row);
    var code=el('span','icode '+(it.bonus?'b':it.layer),main);txt(code,it.id);
    if(it.bonus){var bt=el('span','btag',main);txt(bt,'加分')}
    var name=el('span','iname',main);txt(name,it.name);
    if(it.plat){
      var favs=el('span','favs',main);
      it.plat.forEach(function(f){
        var i=el('i','fav',favs);
        i.style.backgroundImage='url("assets/favicons/'+f+'")';
        i.setAttribute('aria-label',PLATN[f]);i.setAttribute('title',PLATN[f]);
      });
    }
  });
}

function draw(){
  var sankey=document.querySelector('.sankey'),flow=document.querySelector('.flow');
  var colL=document.querySelector('.col-left'),colR=document.querySelector('.col-right');
  var skH=sankey.offsetHeight;
  /* 超出则启用紧凑模式并复测 */
  if(colL.scrollHeight>skH||colR.scrollHeight>skH){
    sankey.classList.add('compact');skH=sankey.offsetHeight;
  }
  var flowR=flow.getBoundingClientRect();
  var NS='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(NS,'svg');
  svg.setAttribute('width',FLOW_W);svg.setAttribute('height',Math.ceil(skH));
  flow.appendChild(svg);
  var gF=document.createElementNS(NS,'g'),gP=document.createElementNS(NS,'g');
  svg.appendChild(gF);svg.appendChild(gP);
  function relY(rect){return rect.top-flowR.top}
  function mkPath(y0,y1,t,color,g){
    var p=document.createElementNS(NS,'path');
    p.setAttribute('d','M 0 '+y0.toFixed(2)+' C '+(FLOW_W*0.38).toFixed(1)+' '+y0.toFixed(2)+', '+(FLOW_W*0.62).toFixed(1)+' '+y1.toFixed(2)+', '+FLOW_W+' '+y1.toFixed(2));
    p.setAttribute('stroke',color);p.setAttribute('stroke-width',t);
    p.setAttribute('fill','none');p.setAttribute('stroke-linecap','butt');
    g.appendChild(p);
  }
  /* 左侧端口：按右侧行序累积带宽 */
  var cards=colL.children,leftBand={};
  for(var ci=0;ci<cards.length;ci++){
    var pr=PROMPTS[ci],cr=cards[ci].getBoundingClientRect();
    var links=ITEMS.filter(function(it){return it.p.indexOf(pr.id)>=0});
    var total=-GAP;links.forEach(function(it){total+=thick(it)+GAP});
    var y=relY(cr)+(cr.height-total)/2;
    links.forEach(function(it){
      var t=thick(it);
      leftBand[pr.id+'|'+it.id]=y+t/2;
      y+=t+GAP;
    });
  }
  /* 右侧行：按 T1→T4 序累积带宽 */
  var rows=colR.children,nF=0,nP=0,links=[],yMin=1e9,yMax=-1e9;
  for(var ri=0;ri<rows.length;ri++){
    var it=ITEMS[ri],rr=rows[ri].getBoundingClientRect();
    var tot=-GAP;it.p.forEach(function(){tot+=thick(it)+GAP});
    var yy=relY(rr)+(rr.height-tot)/2;
    it.p.forEach(function(pid){
      var y0=leftBand[pid+'|'+it.id],y1=yy+thick(it)/2,t=thick(it);
      if(it.layer==='p'){mkPath(y0,y1,t,COLP,gP);nP++}else{mkPath(y0,y1,t,COLF,gF);nF++}
      links.push([it.id,pid,it.layer]);
      yMin=Math.min(yMin,y0-t/2,y1-t/2);yMax=Math.max(yMax,y0+t/2,y1+t/2);
      yy+=t+GAP;
    });
  }
  window.__yzSankey={sankeyH:skH,faint:nF,prom:nP,total:nF+nP,compact:sankey.classList.contains('compact'),
    leftOverflow:colL.scrollHeight>skH,rightOverflow:colR.scrollHeight>skH,
    rowCount:rows.length,cardCount:cards.length,links:links,yMin:Math.round(yMin),yMax:Math.round(yMax),
    svgH:Math.ceil(skH)};
  console.log('YZ-SANKEY',JSON.stringify({sankeyH:skH,faint:nF,prom:nP,total:nF+nP,compact:window.__yzSankey.compact,leftOverflow:window.__yzSankey.leftOverflow,rightOverflow:window.__yzSankey.rightOverflow,rowCount:rows.length,links:links.length,yMin:window.__yzSankey.yMin,yMax:window.__yzSankey.yMax}));
}

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){document.fonts.ready.then(function(){build();draw()})})}
else{document.fonts.ready.then(function(){build();draw()})}
})();
</script>
