(function(){
'use strict';
function measure(){
  var c=document.querySelector('.chart-container'),table=document.querySelector('.dtable');
  var title=document.querySelector('.chart-title');
  var rows=document.querySelectorAll('.dtable tbody tr');
  var rh=[].map.call(rows,function(r){return Math.round(r.getBoundingClientRect().height)});
  var lastRow=rows[rows.length-1],foot=document.querySelector('.chart-footer');
  var gapFoot=Math.round(foot.getBoundingClientRect().top-lastRow.getBoundingClientRect().bottom);
  var overflow=c.scrollHeight>c.clientHeight+1;
  var theadH=Math.round(document.querySelector('.dtable thead').getBoundingClientRect().height);
  var thW=[].map.call(document.querySelectorAll('.dtable thead th'),function(th){return Math.round(th.getBoundingClientRect().width)});
  window.__yzTable={containerH:c.clientHeight,scrollH:c.scrollHeight,overflow:overflow,
    titleH:Math.round(title.getBoundingClientRect().height),
    rowCount:rows.length,rowHeights:rh,theadH:theadH,thW:thW,gapToFooter:gapFoot,
    compact:document.body.classList.contains('compact'),
    bodyText:'T1第一抽平台具体错误信息'};
  console.log('YZ-TABLE',JSON.stringify(window.__yzTable));
  return overflow;
}
function run(){
  var ofw=measure();
  if(ofw){document.body.classList.add('compact');measure()}/* 只压缩一次，不递归 */
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){document.fonts.ready.then(run)})}
else{document.fonts.ready.then(run)}
})();
</script>
