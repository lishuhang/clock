<!doctype html>
<!-- 娱乐资本论信息图 v3.1 / B。先读 SKILL.md 和 style-a.html；只改 YZ_EDIT 区。 -->
<html lang="zh-CN" data-yz-contract="3.1.0" data-yz-mode="b">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Style B</title>
<style>
@font-face{font-family:AliPuHui;src:url('assets/alipuhui-regular.ttf') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:AliPuHui;src:url('assets/alipuhui-bold.ttf') format('truetype');font-weight:700;font-display:block}
@font-face{font-family:AliPuHui;src:url('assets/alipuhui-black.ttf') format('truetype');font-weight:900;font-display:block}
:root{--a:#fc8166;--ad:#e55b46;--t:#312e2e;--s:#6b6666;--m:#9a9595;--l:#e7e3e1}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--t);font-family:AliPuHui,sans-serif}body{width:1080px;height:1080px;overflow:hidden}
.chart-container{width:1080px;height:1080px;display:flex;flex-direction:column;overflow:hidden;padding:58px 64px 42px;background:#fff}.chart-header{height:142px;display:grid;grid-template-columns:80% 20%;align-items:start;flex:none}.chart-title{margin:0;padding:4px 30px 0 0;font-size:48px;line-height:1.16;font-weight:900;letter-spacing:-.8px}.logo-icon{display:block;width:134px;height:90px;object-fit:contain;justify-self:end}
.chart-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:40px;line-height:1.32}.chart-body strong,.yz-emphasis{font-weight:700;color:var(--ad)}.yz-aux{font-size:28px;line-height:1.3;color:var(--s)}
.chart-footer{height:78px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:28px;flex:none;padding-top:15px;border-top:1px solid var(--l)}.chart-source{font-size:27px;line-height:1.25;color:var(--m)}.chart-part{font-size:24px;line-height:1.2;color:var(--m);white-space:nowrap}
.yz-placeholder{display:grid;place-items:center;width:100%;height:100%;border:2px dashed var(--l);color:var(--m)}.yz-avatar{display:block;width:168px;height:168px;border-radius:50%;object-fit:cover;object-position:center;background:#f4f1ef}.yz-avatar-item{display:grid;justify-items:center;gap:13px;min-width:190px}.yz-avatar-name{font-size:40px;font-weight:700}.yz-avatar-value{font-size:28px;color:var(--ad)}table{width:100%;border-collapse:collapse;font-size:40px}th,td{padding:18px 12px;border-bottom:1px solid var(--l);text-align:left}th{font-weight:700;color:var(--s)}
</style></head>
<body><main class="chart-container" data-yz-footer-logo="none"><header class="chart-header">

<footer class="chart-footer"><!-- YZ_EDIT_3_BEGIN --><div class="chart-source">数据来源：豆瓣短评，娱乐资本论整理</div><!-- YZ_EDIT_3_END --><!-- YZ_EDIT_4_BEGIN --><div class="chart-part">1/3</div><!-- YZ_EDIT_4_END --></footer></main>
<script>
async function yzCheck(){await document.fonts.ready;await Promise.all([...document.images].map(i=>i.complete?Promise.resolve():i.decode()));const c=document.querySelector('.chart-container'),t=document.querySelector('.chart-title'),b=document.querySelector('.chart-body'),s=document.querySelector('.chart-source'),p=document.querySelector('.chart-part'),e=[],r=c.getBoundingClientRect();if(document.documentElement.dataset.yzContract!=='3.1.0'||document.documentElement.dataset.yzMode!=='b')e.push('contract');if(Math.round(r.width)!==1080||Math.round(r.height)!==1080)e.push('canvas');if(parseFloat(getComputedStyle(t).fontSize)!==48)e.push('title');if(parseFloat(getComputedStyle(b).fontSize)<40)e.push('body');if(parseFloat(getComputedStyle(s).fontSize)<27||parseFloat(getComputedStyle(p).fontSize)<24)e.push('footer-type');if(!document.fonts.check('900 48px AliPuHui')||!document.fonts.check('400 40px AliPuHui'))e.push('font');if(document.images.length<1||[...document.images].some(i=>!i.naturalWidth))e.push('image');if(document.querySelector('.yz-watermark'))e.push('watermark');if(c.dataset.yzFooterLogo==='none'&&document.querySelector('.brand--horizontal'))e.push('footer-logo');if(/【(?:TITLE|CHART_BODY|SOURCE|PART)_HERE】/.test(document.body.textContent))e.push('placeholder');if([...document.querySelectorAll('.yz-avatar')].some(i=>i.dataset.sprite!==undefined))e.push('sprite');if(c.scrollWidth>c.clientWidth||c.scrollHeight>c.clientHeight)e.push('overflow');if([...document.querySelectorAll('*')].some(n=>getComputedStyle(n).boxShadow!=='none'))e.push('shadow');const o={contract:'YZ-INFOGRAPHIC-V3.1',mode:'b',state:e.length?'noncompliant_fallback':'compliant',errors:e};console[e.length?'error':'log'](o);return o}window.yzCheck=yzCheck;
</script></body></html>
