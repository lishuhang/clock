<script>
const YZ_TIMELINE=Object.freeze({duration:16000,fps:30,frames:480,entranceEnd:6000,holdEnd:10000,stage:{logo:0,title:1500,chrome:3000,body:4500}});let yzAnimations=[],yzReadyPromise=null;
function yzFrame(type,on,hold=false){if(type==='bar')return{opacity:on?1:0,transform:`scaleX(${on?(hold?1.01:1):0})`,transformOrigin:'left center'};if(type==='cell')return{opacity:on?1:0,transform:`scale(${on?(hold?1.025:1):.55})`};if(type==='line')return{opacity:on?1:0,strokeDashoffset:on?'0px':'var(--yz-line-length)'};if(type==='text')return{opacity:on?1:0,transform:`translateY(${on?(hold?-2:0):18}px)`};if(type==='bubble')return{opacity:on?1:0,transform:`translateY(${on?(hold?-8:54):54}px) scale(${on?(hold?1.035:1):.25})`};return{opacity:on?1:0,transform:`translateY(${on?(hold?-2:38):38}px)`}}
function yzBuild(){yzAnimations.forEach(a=>a.cancel());yzAnimations=[];const nodes=[...document.querySelectorAll('[data-yz-motion]')],body=nodes.filter(n=>(n.dataset.yzStage||'body')==='body');for(const n of nodes){const type=n.dataset.yzMotion||'row',stage=n.dataset.yzStage||'body',peers=stage==='body'?body:nodes.filter(x=>(x.dataset.yzStage||'body')===stage),index=Math.max(0,peers.indexOf(n)),order=Number.isFinite(Number(n.dataset.yzOrder))?Number(n.dataset.yzOrder):index,start=Math.min(5600,YZ_TIMELINE.stage[stage]+order*(stage==='body'?130:80)),end=Math.min(6000,start+(stage==='body'?720:680)),reverseStart=16000-end,reverseEnd=16000-start;if(type==='line'&&typeof n.getTotalLength==='function'){const length=Math.ceil(n.getTotalLength());n.style.setProperty('--yz-line-length',length+'px');n.style.strokeDasharray=length+'px'}const off=yzFrame(type,false),on=yzFrame(type,true),hold=yzFrame(type,true,true),frames=[{...off,offset:0},{...off,offset:start/16000,easing:'cubic-bezier(.18,.78,.2,1)'},{...on,offset:end/16000},{...on,offset:6000/16000},{...hold,offset:8000/16000},{...on,offset:10000/16000},{...on,offset:reverseStart/16000,easing:'cubic-bezier(.4,0,.8,.2)'},{...off,offset:reverseEnd/16000},{...off,offset:1}],a=n.animate(frames,{duration:16000,iterations:1,fill:'both',easing:'linear'});a.pause();a.currentTime=0;yzAnimations.push(a)}return yzAnimations}
function yzReady(){if(!yzReadyPromise)yzReadyPromise=(async()=>{await document.fonts.ready;await Promise.all([...document.images].map(i=>i.complete?Promise.resolve():i.decode()));yzBuild();return true})();return yzReadyPromise}async function yzStart(){await yzReady();yzAnimations.forEach(a=>{a.currentTime=0;a.play()})}async function yzSetTime(ms){await yzReady();const t=Math.max(0,Math.min(16000,Number(ms)||0));yzAnimations.forEach(a=>{a.pause();a.currentTime=t});await new Promise(requestAnimationFrame);return t}
async function yzCheck(){await yzReady();const c=document.querySelector('.chart-container'),t=document.querySelector('.chart-title'),e=[],r=c.getBoundingClientRect(),motion=[...document.querySelectorAll('[data-yz-motion]')];if(document.documentElement.dataset.yzContract!=='3.1.0'||document.documentElement.dataset.yzMode!=='c')e.push('contract');if(Math.round(r.width)!==1080||Math.round(r.height)!==1080)e.push('canvas');if(YZ_TIMELINE.duration!==16000||YZ_TIMELINE.fps!==30||YZ_TIMELINE.frames!==480)e.push('timeline');if(parseFloat(getComputedStyle(t).fontSize)!==48)e.push('title');if(!document.fonts.check('900 48px AliPuHui')||!document.fonts.check('400 40px AliPuHui'))e.push('font');if(document.images.length<1||[...document.images].some(i=>!i.naturalWidth))e.push('image');if(motion.filter(n=>(n.dataset.yzStage||'body')==='body').length<1)e.push('body-motion');if(motion.some(n=>!['bar','cell','line','text','bubble','row'].includes(n.dataset.yzMotion)))e.push('motion-type');if(/【(?:TITLE|CHART_BODY|SOURCE|PART)_HERE】/.test(document.body.textContent))e.push('placeholder');if(c.scrollWidth>c.clientWidth||c.scrollHeight>c.clientHeight)e.push('overflow');if([...document.querySelectorAll('*')].some(n=>getComputedStyle(n).boxShadow!=='none'))e.push('shadow');const o={contract:'YZ-INFOGRAPHIC-V3.1',mode:'c',state:e.length?'noncompliant_fallback':'compliant',errors:e};console[e.length?'error':'log'](o);return o}Object.assign(window,{YZ_TIMELINE,yzReady,yzStart,yzSetTime,yzCheck});addEventListener('load',()=>yzStart(),{once:true});
</script></body></html>
