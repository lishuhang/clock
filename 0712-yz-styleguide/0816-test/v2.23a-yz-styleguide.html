<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════════════
  v2.23a-yz-styleguide.html
  娱乐资本论 静态信息图 Skill (step-a)
  Cross-Agent Compatible Edition
═══════════════════════════════════════════════════════════════════════

  PURPOSE
   Transform any data into a brand-compliant static infographic (900px wide).

  QUICK START (4 steps)
  1. Copy everything between BEGIN_TEMPLATE and END_TEMPLATE below
  2. Replace TITLE / CHART_BODY / SOURCE_FOOTER placeholders
  3. Save as .html, open in browser
  4. Run yzCheck() in console — must return true

  CANVAS
  - Width: 900px, height: auto (content-fit)
  - Background: #fff, outer bg: #f0f0f0
  - Padding: 56px top/bottom, 48px left/right
  - Border-radius: 6px

  FONTS (MANDATORY — do NOT substitute)
  - Family: AliPuHui (3 weights: 400/700/900)
  - CDN: @fontpkg/alibaba-puhuiti-3-0
  - Fallback: '阿里巴巴普惠体', sans-serif
  - Do NOT use Noto, Source Han, or system fonts as primary

  BRAND TOKENS
  - Accent: #fc8166  Deep accent: #e55b46  Text: #312e2e
  - Secondary text: #6b6666  Muted: #9a9595
  - Border: #dcdcdc  Soft border: #e5e5e5

  DIMENSION COLORS (for charts with 6 categories)
  - 专业能力: #fc8166   道德人格: #7dd3f9
  - 民族国家: #e74c3c   商业资本: #f39c12
  - 社会文化/性别: #a569bd   身份符号: #a8d08d

  TYPOGRAPHY
  - Title: 68px, weight 900, color #312e2e, line-height 1.3
  - Body text: 28px, weight 400
  - Footer/source: 26px, color #9a9595

  WATERMARK
  - Text-based (NOT SVG — SVG logo path is too large for inline)
  - Content: "娱乐资本论" in accent color
  - Position: absolute centered, rotated -20deg, opacity 0.06, font-size 200px, weight 900
  - z-index: 9999 (above all content)

  LOGO IN FOOTER
  - Text wordmark "娱乐资本论" in accent color #fc8166
  - Font-size: 30px, weight 900
  - Do NOT try to inline the SVG logo path — it is 15000+ lines
  - If you have access to the SVG file, use <img src="logo.svg"> instead

  CHART TYPES (copy the HTML pattern, replace data)
  - Heatmap table: <table class="hm-table"> with rgba backgrounds
  - Stacked bar: <div class="sb-wrap"> with flex segments
  - Pie chart: CSS conic-gradient on a circle div
  - Dumbbell: <div class="dumbbell-track"> with dots and lines
  - Text cards: <div class="tc-grid"> with quote cards
  - Bar chart: <div class="yz-bar-row"> with tracks and fills

  RULES
  1. NO "图N:" prefix in title — use descriptive title directly
  2. NO duplicate title text inside chart-body
  3. NO more than 1 legend with identical content
  4. Heatmap cell bg: rgba(252,129,102, percentage/100), text white if >55%
  5. All visible text MUST use AliPuHui font
  6. Canvas aspect ratio should be 1:1 / 1.2:1 / 1.5:1

  SELF-CHECK
   Run yzCheck() in browser console. It verifies:
  - All required DOM elements exist
  - No unsubstituted placeholders remain
  - Font loaded correctly
  - No duplicate titles
  - Canvas aspect ratio is valid

═══════════════════════════════════════════════════════════════════════
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=900">
<title>【TITLE_HERE】</title>
<style>
/* ══ BRAND FONTS (MANDATORY) ══ */
@font-face{font-family:'AliPuHui';src:url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-55-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'AliPuHui';src:url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-85-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
@font-face{font-family:'AliPuHui';src:url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-115-Black.ttf') format('truetype');font-weight:900;font-display:swap;}

/* ══ BRAND TOKENS ══ */
:root{
  --yz-accent:#fc8166; --yz-accent-deep:#e55b46; --yz-text:#312e2e;
  --yz-text-secondary:#6b6666; --yz-text-muted:#9a9595;
  --yz-bg:#fff; --yz-bg-chart:#efefef; --yz-border:#dcdcdc; --yz-border-soft:#e5e5e5;
  --yz-radius:6px; --yz-font:'AliPuHui','阿里巴巴普惠体',sans-serif;
}

/* ══ RESET ══ */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#f0f0f0;}
body{font-family:var(--yz-font);color:var(--yz-text);}

/* ══ CANVAS ══ */
.chart-container{
  position:relative; width:900px; min-height:auto; height:auto;
  margin:0 auto; background:#fff; padding:56px 48px;
  border-radius:var(--yz-radius); overflow:hidden;
  display:flex; flex-direction:column;
}

/* ══ WATERMARK (text, not SVG) ══ */
.yz-watermark{
  position:absolute!important; inset:0!important;
  display:flex!important; align-items:center; justify-content:center;
  pointer-events:none; z-index:9999;
}
.yz-watermark span{
  font-size:200px; font-weight:900; color:#fc8166;
  opacity:0.06; transform:rotate(-20deg); white-space:nowrap;
}

/* ══ TITLE ══ */
.chart-title{
  position:relative; z-index:2;
  font-size:68px; font-weight:900; color:var(--yz-text);
  margin-bottom:24px; line-height:1.3; text-align:left;
}

/* ══ CHART BODY ══ */
.chart-body{
  position:relative; z-index:auto;
  flex:0 1 auto; min-height:auto;
  display:flex; flex-direction:column;
}

/* ══ FOOTER ══ */
.chart-footer{
  position:relative; z-index:2;
  display:flex; justify-content:space-between; align-items:flex-end;
  margin-top:36px; padding-top:24px;
  border-top:1px solid var(--yz-border-soft); flex-shrink:0;
}
.chart-source{
  font-size:26px; color:var(--yz-text-muted);
  text-align:left; line-height:1.6; max-width:60%;
}
.yz-logo{
  font-size:30px; font-weight:900; color:var(--yz-accent); flex-shrink:0;
}

/* ══ SHARED COMPONENTS ══ */
/* Bar chart */
.yz-bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.yz-bar-label{width:240px;font-size:28px;color:var(--yz-text);text-align:right;flex-shrink:0;}
.yz-bar-track{flex:1;height:32px;background:var(--yz-bg-chart);border-radius:var(--yz-radius);position:relative;overflow:hidden;}
.yz-bar{height:100%;background:var(--c,var(--yz-accent));border-radius:var(--yz-radius);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#111;font-weight:900;font-size:28px;}
.yz-bar-value{margin-left:8px;font-weight:900;font-size:28px;color:var(--yz-text);}

/* Data table */
.yz-table{width:100%;border-collapse:collapse;font-size:28px;}
.yz-table th{background:var(--yz-bg-chart);padding:10px 12px;text-align:left;font-weight:900;color:var(--yz-text);border-bottom:2px solid var(--yz-border);}
.yz-table td{padding:8px 12px;border-bottom:1px solid var(--yz-border-soft);color:var(--yz-text);}
.yz-table tr:nth-child(even) td{background:#fafafa;}

/* Heatmap */
.hm-table{width:100%;border-collapse:collapse;font-size:24px;}
.hm-table th{background:var(--yz-bg-chart);padding:10px 8px;text-align:center;font-weight:900;font-size:22px;color:var(--yz-text);border:1px solid var(--yz-border-soft);}
.hm-table td{padding:8px 6px;text-align:center;border:1px solid var(--yz-border-soft);font-weight:700;}
.hm-table .row-label{text-align:left;font-weight:900;font-size:22px;padding-left:12px;white-space:nowrap;}
.hm-legend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:22px;color:var(--yz-text-secondary);}
.hm-legend .grad{width:120px;height:14px;border-radius:3px;background:linear-gradient(to right,rgba(252,129,102,0.05),rgba(252,129,102,0.9));}

/* Stacked bar */
.sb-wrap{display:flex;flex-direction:column;gap:16px;}
.sb-row{display:flex;align-items:center;gap:16px;}
.sb-row .phase-label{width:220px;font-size:24px;font-weight:900;color:var(--yz-text);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sb-row .phase-badge{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;background:var(--yz-accent);color:#fff;border-radius:50%;font-size:20px;font-weight:900;flex-shrink:0;}
.sb-bar{flex:1;height:36px;border-radius:var(--yz-radius);overflow:hidden;display:flex;}
.sb-seg{display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;min-width:0;overflow:hidden;white-space:nowrap;}

/* Legend */
.chart-legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:22px;color:var(--yz-text-secondary);}
.legend-swatch{width:16px;height:16px;border-radius:3px;flex-shrink:0;}
.legend-swatch.bar{height:14px;}

/* Text card grid */
.tc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.tc-card{background:rgba(255,255,255,0.92);border:1px solid var(--yz-border-soft);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px;}
.tc-card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.tc-phase{font-size:24px;font-weight:900;color:var(--yz-accent);display:flex;align-items:center;gap:6px;}
.tc-work{font-size:22px;color:var(--yz-text);}
.tc-meta{font-size:20px;color:var(--yz-text-secondary);margin-left:auto;}
.tc-quote{font-size:24px;line-height:1.6;color:var(--yz-text);background:#fafafa;padding:12px 16px;border-radius:8px;border-left:4px solid var(--yz-accent);}
.qmark{color:var(--yz-accent);font-weight:900;}

/* Phase badge (reusable) */
.phase-badge{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;background:var(--yz-accent);color:#fff;border-radius:50%;font-size:20px;font-weight:900;flex-shrink:0;}

/* ══ SELF-CHECK BANNER ══ */
#yz-selfcheck-banner{
  position:absolute; top:8px; right:8px;
  padding:6px 12px; border-radius:6px;
  font-family:var(--yz-font); font-size:12px; font-weight:700;
  z-index:99999; color:#fff;
}
#yz-selfcheck-banner.pass{background:#50c885;}
#yz-selfcheck-banner.fail{background:#e60012;}

/* ══ BEGIN_TEMPLATE ══ */
/* ↑↑↑ ALL CSS ABOVE IS LOCKED — DO NOT MODIFY ↑↑↑ */
/* ↓↓↓ ADD YOUR CHART-SPECIFIC CSS BELOW ↓↓↓ */

/* ══ END_TEMPLATE ══ */
</style>
</head>
<body>
<div class="chart-container">
  <div id="yz-selfcheck-banner">⏳ 检查中...</div>
  <div class="yz-watermark"><span>娱乐资本论</span></div>
  <h1 class="chart-title">【TITLE_HERE】</h1>
  <div class="chart-body">
【CHART_BODY_HERE】
  </div>
  <div class="chart-footer">
    <div class="chart-source">【SOURCE_FOOTER_HERE】</div>
    <div class="yz-logo">娱乐资本论</div>
  </div>
</div>
<script>
function yzCheck(){
  var e=[];
  var r=document.querySelector.bind(document);
  if(!r('.chart-container'))e.push('missing .chart-container');
  if(!r('.yz-watermark'))e.push('missing .yz-watermark');
  if(!r('.chart-title'))e.push('missing .chart-title');
  if(!r('.chart-body'))e.push('missing .chart-body');
  if(!r('.chart-source'))e.push('missing .chart-source');
  if(!r('.yz-logo'))e.push('missing .yz-logo');
  var h=document.body.innerHTML;
  if(h.indexOf('TITLE_HERE')>-1)e.push('placeholder TITLE_HERE not replaced');
  if(h.indexOf('CHART_BODY_HERE')>-1)e.push('placeholder CHART_BODY_HERE not replaced');
  if(h.indexOf('SOURCE_FOOTER_HERE')>-1)e.push('placeholder SOURCE_FOOTER_HERE not replaced');
  var t=r('.chart-title');
  if(t&&/^图\s*\d+/.test(t.textContent.trim()))e.push('title has '图N' prefix — forbidden');
  var b=document.getElementById('yz-selfcheck-banner');
  if(e.length===0){if(b){b.className='pass';b.textContent='✅ v2.23a check passed';}return true;}
  else{if(b){b.className='fail';b.textContent='❌ '+e.length+' issues';}console.error(e);return false;}
}
document.fonts?document.fonts.ready.then(function(){setTimeout(yzCheck,200);}):window.addEventListener('load',function(){setTimeout(yzCheck,500);});
</script>
</body>
</html>
