<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吴京：四阶段评论变迁</title>
<style>
    @import url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/style.css');
    @font-face {
        font-family: 'AliPuHui';
        src: url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-55-Regular.ttf') format('truetype');
        font-weight: 400;
    }
    @font-face {
        font-family: 'AliPuHui';
        src: url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-85-Bold.ttf') format('truetype');
        font-weight: 700;
    }
    @font-face {
        font-family: 'AliPuHui';
        src: url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-115-Black.ttf') format('truetype');
        font-weight: 900;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        background: #f0f0f0;
        font-family: 'AliPuHui', 'Alibaba PuHuiTi 3.0', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        display: flex; justify-content: center; padding: 40px 20px;
    }
    .chart-container {
        width: 900px;
        padding: 56px 48px;
        background: #fff;
        border-radius: 6px;
        position: relative;
        overflow: hidden;
    }
    .chart-container::before {
        content: '娱乐资本论';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%,-50%) rotate(-30deg);
        font-size: 180px;
        font-weight: 900;
        color: #312e2e;
        opacity: 0.04;
        white-space: nowrap;
        pointer-events: none;
        z-index: 0;
    }
    .chart-container > * { position: relative; z-index: 1; }
    .chart-title {
        font-size: 68px;
        font-weight: 900;
        color: #312e2e;
        line-height: 1.2;
        margin-bottom: 40px;
    }
    .chart-subtitle {
        font-size: 24px;
        color: #888;
        margin-bottom: 36px;
        font-weight: 400;
    }
    .chart-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid #eee;
    }
    .chart-footer .source {
        font-size: 16px;
        color: #aaa;
    }
    .chart-footer .brand {
        font-size: 20px;
        font-weight: 900;
        color: #fc8166;
    }
    
    .stages-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    }
    .stage-card {
        border: 1px solid #eee; border-radius: 8px; padding: 24px; position: relative;
        transition: box-shadow 0.3s;
    }
    .stage-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    .phase-badge {
        display: inline-block; background: #fc8166; color: #fff; font-size: 13px;
        font-weight: 700; padding: 3px 12px; border-radius: 20px; margin-bottom: 12px;
    }
    .stage-label {
        font-size: 22px; font-weight: 900; color: #312e2e; margin-bottom: 4px;
    }
    .stage-years {
        font-size: 14px; color: #aaa; margin-bottom: 16px;
    }
    .quote-card {
        background: #fafafa; border-left: 3px solid #fc8166; padding: 14px 16px; border-radius: 0 6px 6px 0;
        font-size: 16px; color: #555; line-height: 1.7;
    }
    .quote-meta {
        display: flex; gap: 12px; margin-top: 10px; font-size: 13px; color: #bbb;
    }
    .quote-meta span { background: #f0f0f0; padding: 2px 8px; border-radius: 4px; }
    .actor-name {
        font-size: 28px; font-weight: 900; color: #312e2e; margin-bottom: 24px;
        display: flex; align-items: center; gap: 12px;
    }
    .actor-name::before {
        content: ''; display: block; width: 6px; height: 28px; background: #fc8166; border-radius: 3px;
    }
    </style>
</head>
<body>
<div class="chart-container">
    <div class="chart-title">吴京：四阶段评论变迁</div>
    <div class="actor-name">吴京 · 四阶段代表评论</div><div class="stages-grid"><div class="stage-card"><div class="phase-badge">阶段一</div><div class="stage-label">初识期</div><div class="stage-years">2012-2015</div><div class="quote-card">「我没多强的军旅知识，就是喜欢吴京这类硬汉。」</div></div><div class="stage-card"><div class="phase-badge">阶段二</div><div class="stage-label">崛起期</div><div class="stage-years">2015-2017</div><div class="quote-card">「开篇长镜头惊险大气……真刀真枪让人不禁热血沸腾……民族自豪心砰砰跳个不停。」</div><div class="quote-meta"><span>2万赞</span><span>4星</span></div></div><div class="stage-card"><div class="phase-badge">阶段三</div><div class="stage-label">巅峰期</div><div class="stage-years">2019-2021</div><div class="quote-card">「从特效和技术上讲，这应该是迄今为止此类中国电影的巅峰了，磅礴恢宏，细节营造用心。」</div></div><div class="stage-card"><div class="phase-badge">阶段四</div><div class="stage-label">回归期</div><div class="stage-years">2023-2026</div><div class="quote-card">「《镖人》讨论中，专业能力讨论占94%，家国仅占4%——观众回归冷静审视。」</div></div></div>
    <div class="chart-footer">
        <span class="source">数据来源：豆瓣电影评论</span>
        <span class="brand">娱乐资本论</span>
    </div>
</div>
</body>
</html>
