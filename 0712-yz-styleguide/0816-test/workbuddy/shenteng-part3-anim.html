<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>沈腾作品代表性评论（3/6）</title>
<style>
@font-face{font-family:'AliPuHui';src:url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-55-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'AliPuHui';src:url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-85-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
@font-face{font-family:'AliPuHui';src:url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-115-Black.ttf') format('truetype');font-weight:900;font-display:swap;}
:root{--yz-accent:#fc8166;--yz-accent-deep:#e55b46;--yz-text:#312e2e;--yz-text-secondary:#6b6666;--yz-text-muted:#9a9595;--yz-border-soft:#e5e5e5;--yz-radius:6px;--yz-font:'AliPuHui',sans-serif;--yz-fs-title:48px;--yz-fs-footer:27px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--yz-font);background:#f0f0f0;padding:20px;}
.chart-container-1x1{position:relative;width:1080px;height:1080px;margin:0 auto;background:#fff;padding:36px 44px;border-radius:var(--yz-radius);overflow:hidden;display:flex;flex-direction:column;}
.chart-header-1x1{display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0;margin-bottom:24px;gap:24px;}
.chart-title-1x1{width:80%;font-size:var(--yz-fs-title);font-weight:900;color:var(--yz-text);line-height:1.35;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
.chart-logo-1x1{width:20%;display:flex;align-items:flex-start;justify-content:flex-end;flex-shrink:0;}
.brand-logo{font-size:40px;font-weight:900;color:var(--yz-accent);line-height:1.1;}
.chart-body-1x1{flex:1 1 auto;position:relative;z-index:auto;display:flex;flex-direction:column;justify-content:center;min-height:0;gap:28px;}
.quote-card{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px;background:#fff6f3;border:2px solid #f6d3c8;border-radius:14px;padding:44px 52px;}
.qc-meta{display:flex;align-items:center;gap:18px;}
.qc-badge{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;background:var(--yz-accent);color:#fff;border-radius:50%;font-size:32px;font-weight:900;flex-shrink:0;}
.qc-film{font-size:42px;font-weight:900;color:var(--yz-text);}
.qc-year{font-size:30px;color:var(--yz-text-muted);margin-left:auto;font-weight:700;}
.qc-quote{font-size:46px;line-height:1.62;font-weight:500;color:var(--yz-text);text-align:center;}
.qc-quote .qm{color:var(--yz-accent);font-weight:900;}
.qc-foot{display:flex;justify-content:space-between;align-items:baseline;font-size:28px;color:var(--yz-text-secondary);}
.qc-like{color:var(--yz-accent-deep);font-weight:900;font-size:30px;}
.chart-footer-1x1{flex-shrink:0;margin-top:20px;padding-top:14px;border-top:1px solid var(--yz-border-soft);display:flex;justify-content:space-between;align-items:baseline;}
.chart-source-1x1{font-size:var(--yz-fs-footer);color:var(--yz-text-muted);text-align:left;line-height:1.5;flex:1;}
.chart-part-num{font-size:24px;color:var(--yz-text-muted);font-weight:700;white-space:nowrap;margin-left:20px;}
</style>
<style data-purpose="round3-animations">
@keyframes fadeIn{ to{ opacity:1; } }
.chart-logo-1x1{ opacity:0; animation: fadeIn 1.2s ease-out 0s forwards; }
.chart-title-1x1{ opacity:0; animation: fadeIn 1.2s ease-out 1.5s forwards; }
.chart-source-1x1{ opacity:0; animation: fadeIn 1.2s ease-out 3s forwards; }
.chart-part-num{ opacity:0; animation: fadeIn 1.2s ease-out 3s forwards; }
.chart-body-1x1{ opacity:0; animation: fadeIn 1.5s ease-out 4.5s forwards; }
#yz-selfcheck-banner{ display:none !important; }
body{ background:#fff !important; padding:0 !important; margin:0 !important; }
</style>
</head>
<body>
  <div class="chart-container-1x1">
    <div class="chart-header-1x1">
      <div class="chart-title-1x1">沈腾作品代表性评论</div>
      <div class="chart-logo-1x1"><div class="brand-logo">娱乐<br>资本论</div></div>
    </div>
    <div class="chart-body-1x1">
      <div class="quote-card">
        <div class="qc-meta">
          <span class="qc-badge">2</span>
          <span class="qc-film">《飞驰人生》</span>
          <span class="qc-year">2019</span>
        </div>
        <div class="qc-quote"><span class="qm">“</span>很搞笑，拉力赛超级燃，后面有点感动，居然还看哭了。<span class="qm">”</span></div>
        <div class="qc-foot">
          <span class="qc-like">高赞</span>
          <span>来源：豆瓣</span>
        </div>
      </div>
    </div>
    <div class="chart-footer-1x1">
      <div class="chart-source-1x1">数据来源：豆瓣短评 · 娱乐资本论整理</div>
      <div class="chart-part-num">3/6</div>
    </div>
  </div>
</body>
</html>
