<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════════════
  v2.23b-yz-styleguide.html
  娱乐资本论 1:1 拆图 Skill (step-b)
  Cross-Agent Compatible Edition
═══════════════════════════════════════════════════════════════════════

  PURPOSE
   Split a 900px step-a infographic into 1080×1080 (1:1) cards for video.

  QUICK START (4 steps)
  1. Copy everything between BEGIN_TEMPLATE and END_TEMPLATE
  2. Replace TITLE / CHART_BODY / SOURCE / PART_NUM
  3. Save as img{n}-part{m}-styled.html
  4. Run yzCheck1x1() in console — must return true

  CANVAS
  - Size: 1080×1080px (fixed, NOT responsive)
  - Padding: 36px top/bottom, 44px left/right
  - Background: #fff, outer: #f0f0f0

  LAYOUT (top to bottom)
  1. Header (flex, ~140px): title (80% width, 48px) + logo area (20%)
  2. Chart body (flex:1, ~760px): centered content
  3. Footer (~100px): source left + part number right

  LOGO (CRITICAL — read carefully)
  - USE text wordmark "娱乐资本论" in accent color #fc8166
  - Font-size: 40px, weight 900
  - DO NOT try to use SVG logo inline — the path is 15000+ lines
  - DO NOT leave logo area empty
  - IF the SVG file exists on disk, use <img src="path/to/logo.svg">
  - The previous version referenced #yz-logo-icon sprite which
    does NOT exist in standalone files — this was a critical bug

  SPLIT RULES
  - 1 card = 1 core message ("1图1焦点")
  - Split by information density, not by pixel size
  - Transformation examples:
    * Stacked bar (multi-dimension) → 1 pie per dimension
    * 10-row heatmap → 4-3-3 split
    * 4 text cards 2×2 → 1 card per quote
    * Multi-series line → 1 dumbbell per dimension
  - File naming: img{n}-part{m}-styled.html (m starts at 1)
  - All split images share the SAME title

  FONT SIZE LIMITS (MANDATORY)
  - Body/data text: ≥40px
  - Auxiliary (legend, axis, metadata): ≥28px
  - Footer/source: ≥27px
  - Part number: ≥24px
  - NEVER shrink below these to fit content — split more cards instead

  CONTENT FILL RULES
  - Chart content MUST fill the 760px body area (max 10% white space)
  - Pie diameter ≥540px (50% of canvas)
  - Bar/dumbbell height ≥ body_height / N_rows
  - Short content (single quote): enlarge font to fill space

  OVERFLOW HANDLING
  - Do NOT shrink fonts
  - Do wrap long text (film name: year on line 1, name on line 2)
  - Do move legend below chart if chart is too full
  - Do split into more cards

  ANIMATION COMPATIBILITY
  - All animated elements MUST have one of these classes:
    .chart-logo-1x1  .chart-title-1x1  .chart-body-1x1
    .chart-source-1x1  .chart-part-num  .chart-legend
  - Step-c will animate these classes — make sure they exist

═══════════════════════════════════════════════════════════════════════
-->
<!-- BEGIN_TEMPLATE -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>【TITLE_HERE】</title>
<style>
@font-face{font-family:'AliPuHui';src:url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-55-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'AliPuHui';src:url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-85-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
@font-face{font-family:'AliPuHui';src:url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-115-Black.ttf') format('truetype');font-weight:900;font-display:swap;}
:root{
  --yz-accent:#fc8166;--yz-accent-deep:#e55b46;--yz-text:#312e2e;
  --yz-text-secondary:#6b6666;--yz-text-muted:#9a9595;
  --yz-border-soft:#e5e5e5;--yz-radius:6px;
  --yz-font:'AliPuHui',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--yz-font);background:#f0f0f0;padding:20px;}

/* ══ CANVAS 1080×1080 ══ */
.chart-container-1x1{
  position:relative;width:1080px;height:1080px;margin:0 auto;
  background:#fff;padding:36px 44px;border-radius:var(--yz-radius);
  overflow:hidden;display:flex;flex-direction:column;
}

/* ══ HEADER ══ */
.chart-header-1x1{
  display:flex;align-items:flex-start;justify-content:space-between;
  flex-shrink:0;margin-bottom:24px;gap:24px;
}
.chart-title-1x1{
  width:80%;font-size:48px;font-weight:900;color:var(--yz-text);
  line-height:1.35;
}
.chart-logo-1x1{
  width:20%;display:flex;align-items:flex-start;justify-content:flex-end;flex-shrink:0;
}
/* LOGO: use text wordmark (see docs above) */
.brand-logo{font-size:40px;font-weight:900;color:var(--yz-accent);line-height:1.1;}

/* ══ CHART BODY ══ */
.chart-body-1x1{
  flex:1 1 auto;position:relative;z-index:auto;
  display:flex;flex-direction:column;justify-content:center;min-height:0;
}

/* ══ FOOTER ══ */
.chart-footer-1x1{
  flex-shrink:0;margin-top:20px;padding-top:14px;
  border-top:1px solid var(--yz-border-soft);
  display:flex;justify-content:space-between;align-items:baseline;
}
.chart-source-1x1{font-size:27px;color:var(--yz-text-muted);text-align:left;line-height:1.5;flex:1;}
.chart-part-num{font-size:24px;color:var(--yz-text-muted);font-weight:700;white-space:nowrap;margin-left:20px;}

/* ══ SHARED CHART COMPONENTS ══ */
.chart-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:28px;color:var(--yz-text-secondary);}
.legend-swatch{width:20px;height:20px;border-radius:4px;flex-shrink:0;}
.axis-scale{display:flex;justify-content:space-between;padding:8px 0;font-size:24px;color:var(--yz-text-muted);}
.phase-badge{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;background:var(--yz-accent);color:#fff;border-radius:50%;font-size:28px;font-weight:900;flex-shrink:0;}
.hm-table{width:100%;border-collapse:collapse;}
.hm-table th{background:#efefef;padding:10px 8px;text-align:center;font-weight:900;font-size:28px;color:var(--yz-text);border:1px solid var(--yz-border-soft);}
.hm-table td{padding:10px 8px;text-align:center;border:1px solid var(--yz-border-soft);font-weight:700;font-size:28px;}
.hm-table .row-label{text-align:left;font-weight:900;padding-left:12px;white-space:nowrap;}
.hm-legend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:28px;color:var(--yz-text-secondary);}
.hm-legend .grad{width:120px;height:16px;border-radius:3px;background:linear-gradient(to right,rgba(252,129,102,0.05),rgba(252,129,102,0.9));}

/* ══ SELF-CHECK ══ */
#yz-selfcheck-banner{
  position:absolute;top:8px;right:8px;padding:6px 12px;
  border-radius:6px;font-family:var(--yz-font);font-size:12px;
  font-weight:700;z-index:99999;color:#fff;
}
#yz-selfcheck-banner.pass{background:#50c885;}
#yz-selfcheck-banner.fail{background:#e60012;}
</style>
</head>
<body>
<div class="chart-container-1x1">
  <div id="yz-selfcheck-banner">⏳</div>
  <div class="chart-header-1x1">
    <div class="chart-title-1x1">【TITLE_HERE】</div>
    <div class="chart-logo-1x1"><div class="brand-logo">娱乐<br>资本论</div></div>
  </div>
  <div class="chart-body-1x1">
【CHART_BODY_HERE】
  </div>
  <div class="chart-footer-1x1">
    <div class="chart-source-1x1">【SOURCE_FOOTER_HERE】</div>
    <div class="chart-part-num">【PART_NUM_HERE】</div>
  </div>
</div>
<script>
function yzCheck1x1(){
  var e=[];
  var r=document.querySelector.bind(document);
  if(!r('.chart-container-1x1'))e.push('missing .chart-container-1x1');
  if(!r('.chart-title-1x1'))e.push('missing .chart-title-1x1');
  if(!r('.chart-logo-1x1'))e.push('missing .chart-logo-1x1');
  if(!r('.chart-body-1x1'))e.push('missing .chart-body-1x1');
  if(!r('.chart-source-1x1'))e.push('missing .chart-source-1x1');
  if(!r('.chart-part-num'))e.push('missing .chart-part-num');
  /* Check logo is NOT empty */
  var logo=r('.chart-logo-1x1');
  if(logo&&logo.textContent.trim().length<2)e.push('logo area is empty — must contain brand wordmark or img');
  /* Check min font sizes */
  var body=r('.chart-body-1x1');
  if(body){
    var elems=body.querySelectorAll('*');
    var minBody=Infinity,minAux=Infinity;
    elems.forEach(function(el){
      var s=window.getComputedStyle(el);
      var fs=parseFloat(s.fontSize);
      if(fs>0&&s.opacity!=='0'&&s.visibility!=='hidden'&&el.textContent.trim().length>0){
        if(fs<minBody)minBody=fs;
      }
    });
    if(minBody<40)e.push('body font '+minBody.toFixed(0)+'px < 40px minimum');
  }
  var h=document.body.innerHTML;
  if(h.indexOf('TITLE_HERE')>-1)e.push('TITLE_HERE not replaced');
  if(h.indexOf('CHART_BODY_HERE')>-1)e.push('CHART_BODY_HERE not replaced');
  var b=document.getElementById('yz-selfcheck-banner');
  if(e.length===0){if(b){b.className='pass';b.textContent='✅ v2.23b OK';}return true;}
  else{if(b){b.className='fail';b.textContent='❌ '+e.length+' issues';}console.error(e);return false;}
}
document.fonts?document.fonts.ready.then(function(){setTimeout(yzCheck1x1,200);}):window.addEventListener('load',function(){setTimeout(yzCheck1x1,500);});
</script>
</body>
</html>
<!-- END_TEMPLATE -->
