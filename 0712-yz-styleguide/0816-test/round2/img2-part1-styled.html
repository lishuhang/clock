<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专业能力评价焦点三阶段变迁 - 1/3</title>
<style>
    @import url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/style.css');
    @font-face {
        font-family: 'AliPuHui';
        src: url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-55-Regular.ttf') format('truetype');
        font-weight: 400;
    }
    @font-face {
        font-family: 'AliPuHui';
        src: url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-85-Bold.ttf') format('truetype');
        font-weight: 700;
    }
    @font-face {
        font-family: 'AliPuHui';
        src: url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-115-Black.ttf') format('truetype');
        font-weight: 900;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        background: #f0f0f0;
        font-family: 'AliPuHui', 'Alibaba PuHuiTi 3.0', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        display: flex; justify-content: center; align-items: center;
        min-height: 100vh; padding: 20px;
    }
    .chart-container-1x1 {
        width: 1080px;
        height: 1080px;
        padding: 36px 44px;
        background: #fff;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
    }
    .chart-container-1x1::before {
        content: '娱乐资本论';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%,-50%) rotate(-30deg);
        font-size: 160px;
        font-weight: 900;
        color: #312e2e;
        opacity: 0.04;
        white-space: nowrap;
        pointer-events: none;
        z-index: 0;
    }
    .chart-container-1x1 > * { position: relative; z-index: 1; }
    .title-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 28px;
        flex-shrink: 0;
    }
    .title-row .title {
        font-size: 48px;
        font-weight: 900;
        color: #312e2e;
        line-height: 1.25;
        width: 80%;
    }
    .title-row .logo {
        font-size: 28px;
        font-weight: 900;
        color: #fc8166;
        white-space: nowrap;
        width: 20%;
        text-align: right;
    }
    .chart-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 0;
    }
    .chart-footer-1x1 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid #eee;
    }
    .chart-footer-1x1 .source {
        font-size: 27px;
        color: #aaa;
    }
    .chart-footer-1x1 .part-num {
        font-size: 27px;
        color: #aaa;
        font-weight: 700;
    }
    
        .pie-container { display: flex; align-items: center; justify-content: center; gap: 60px; }
        .pie-chart { position: relative; width: 400px; height: 400px; border-radius: 50%; flex-shrink: 0; }
        .pie-label-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            text-align: center; font-size: 40px; font-weight: 900; color: #312e2e; line-height: 1.3;
        }
        .pie-label-center .sub { font-size: 28px; color: #aaa; font-weight: 400; }
        .pie-legend { display: flex; flex-direction: column; gap: 12px; }
        .pie-leg-item { display: flex; align-items: center; gap: 10px; font-size: 36px; color: #312e2e; }
        .pie-leg-dot { width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0; }
        .pie-leg-pct { margin-left: auto; font-weight: 700; color: #666; width: 80px; text-align: right; }
        .phase-banner {
            background: #fff3f0; color: #fc8166; font-size: 36px; font-weight: 700;
            padding: 12px 24px; border-radius: 8px; margin-bottom: 28px; text-align: center;
        }
        </style>
</head>
<body>
<div class="chart-container-1x1">
    <div class="title-row">
        <div class="title">专业能力评价焦点三阶段变迁</div>
        <div class="logo">娱乐资本论</div>
    </div>
    <div class="chart-body">
        <div class="phase-banner">阶段1：喜剧演员定型期（2015-2018）</div><div class="pie-container"><div class="pie-chart" style="background:conic-gradient(#fc8166 0% 78%, #4e79a7 78% 86%, #59a14f 86% 91%, #f28e2b 91% 95%, #76b7b2 95% 98%, #b07aa1 98% 100%)"><div class="pie-label-center">喜剧演员定型期<br><span class="sub">2015-2018</span></div></div><div class="pie-legend"><div class="pie-leg-item"><div class="pie-leg-dot" style="background:#fc8166"></div>喜剧/搞笑<span class="pie-leg-pct">78%</span></div><div class="pie-leg-item"><div class="pie-leg-dot" style="background:#4e79a7"></div>演技<span class="pie-leg-pct">8%</span></div><div class="pie-leg-item"><div class="pie-leg-dot" style="background:#59a14f"></div>共情/感染力<span class="pie-leg-pct">5%</span></div><div class="pie-leg-item"><div class="pie-leg-dot" style="background:#f28e2b"></div>角色塑造<span class="pie-leg-pct">4%</span></div><div class="pie-leg-item"><div class="pie-leg-dot" style="background:#76b7b2"></div>剧情/节奏<span class="pie-leg-pct">3%</span></div><div class="pie-leg-item"><div class="pie-leg-dot" style="background:#b07aa1"></div>其他<span class="pie-leg-pct">2%</span></div></div></div>
    </div>
    <div class="chart-footer-1x1">
        <span class="source">数据来源：豆瓣电影评论</span>
        <span class="part-num">1/3</span>
    </div>
</div>
</body>
</html>
