<!DOCTYPE html>

<style>
    @import url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/style.css');
    @font-face {
        font-family: 'AliPuHui';
        src: url('https://cdn.jsdelivr.net/npm/@fontpkg/alibaba-puhuiti-3-0@0.0.0/AlibabaPuHuiTi-3-55-Regular.ttf') format('truetype');
        font-weight: 400;

        font-weight: 700;
    }
    @font-face {
        font-family: 'AliPuHui';

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        background: #f0f0f0;

        display: flex; justify-content: center; align-items: center;
        min-height: 100vh; padding: 20px;
    }
    .chart-container-1x1 {
        width: 1080px;
        height: 1080px;
        padding: 36px 44px;
        background: #fff;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
    }
    .chart-container-1x1::before {
        content: '娱乐资本论';
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%,-50%) rotate(-30deg);
        font-size: 160px;
        font-weight: 900;
        color: #312e2e;
        opacity: 0.04;
        white-space: nowrap;
        pointer-events: none;
        z-index: 0;
    }
    .chart-container-1x1 > * { position: relative; z-index: 1; }
    .title-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 28px;
        flex-shrink: 0;
    }
    .title-row .title {
        font-size: 48px;
        font-weight: 900;
        color: #312e2e;
        line-height: 1.25;
        width: 80%;
    }
    .title-row .logo {
        font-size: 28px;
        font-weight: 900;
        color: #fc8166;
        white-space: nowrap;
        width: 20%;
        text-align: right;
    }
    .chart-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 0;
    }
    .chart-footer-1x1 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid #eee;
    }
    .chart-footer-1x1 .source {
        font-size: 27px;
        color: #aaa;
    }
    .chart-footer-1x1 .part-num {
        font-size: 27px;
        color: #aaa;
        font-weight: 700;
    }
    
        .hm-table {
            width: 100%; border-collapse: collapse; font-size: 40px;
        }
        .hm-table th, .hm-table td {
            padding: 12px 6px; text-align: center; border-bottom: 1px solid #f0f0f0;
        }
        .hm-table thead th {
            font-size: 32px; font-weight: 700; color: #888; padding-bottom: 16px;
            border-bottom: 2px solid #ddd;
        }
        .hm-table thead th:first-child { text-align: left; width: 200px; }
        .hm-table tbody td:first-child {
            text-align: left; font-weight: 700; color: #312e2e; font-size: 36px; white-space: nowrap;
        }
        .hm-cell {
            min-width: 100px; border-radius: 6px; color: #312e2e; font-weight: 700; font-size: 36px; padding: 8px 4px;
        }
        .hm-cell.zero { color: #ddd; }
        .legend-b {
            display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px;
        }
        .legend-b-item { display: flex; align-items: center; gap: 6px; font-size: 28px; color: #666; }
        .legend-b-dot { width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0; }
        .part-subtitle { font-size: 36px; color: #888; margin-bottom: 24px; font-weight: 400; }
        </style>

    <style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .logo { animation: fadeIn 0.8s ease-out 0s both; }
    .title-row, .chart-title { animation: fadeIn 0.8s ease-out 0.2s both; }
    .legend-row, .chart-subtitle { animation: fadeIn 0.8s ease-out 0.5s both; }
    .chart-body, .heatmap-table, .bar-section, .comparison-section, .comment-card { animation: fadeIn 0.9s ease-out 0.8s both; }
    .chart-footer, .chart-footer-1x1 { animation: fadeIn 0.7s ease-out 1.0s both; }
    </style>
    </head>
<body>
